services:
  web:
    image: ${CHARTS_APP_IMAGE:?Set versioned Web and worker image}
    profiles: [web]
    restart: unless-stopped
    read_only: true
    working_dir: /app
    user: "1000:1000"
    env_file: ["${CHARTS_RUNTIME_ENV_FILE:?Set node-specific runtime environment file}"]
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3110
    command: [node, server.js]
    ports: ["${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-3110}:3110"]
    tmpfs: [/tmp, "/app/.next-production/cache:uid=1000,gid=1000,mode=0700,size=134217728"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3110/api/healthz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 20s
      timeout: 5s
      retries: 3
    mem_limit: 768m
    cpus: "1.0"
    pids_limit: 256
    logging: &logs
      driver: json-file
      options: {max-size: 10m, max-file: "5"}
  worker:
    image: ${CHARTS_APP_IMAGE:?Set versioned Web and worker image}
    profiles: [worker]
    restart: unless-stopped
    read_only: true
    working_dir: /app
    user: "1000:1000"
    env_file: ["${CHARTS_RUNTIME_ENV_FILE:?Set node-specific runtime environment file}"]
    command: [node, worker.mjs]
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, node, -e, "const fs=require('fs');process.exit(Date.now()-Number(fs.readFileSync(process.env.CHARTS_WORKER_HEALTH_FILE,'utf8'))<120000?0:1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    mem_limit: 384m
    cpus: "0.5"
    pids_limit: 128
    logging: *logs
