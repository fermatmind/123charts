# Derived from Supabase official Docker + Kong override, pinned in upstream.
name: ${COMPOSE_PROJECT_NAME:?Set an independent 123charts project name}
services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    volumes:
    - ./upstream/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:ro
    - ./upstream/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    - ./upstream/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
    - ./upstream/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:ro
    - database:/var/lib/postgresql/data
    - database-config:/etc/postgresql-custom
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - postgres
      - -h
      - localhost
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: '5432'
      POSTGRES_PORT: '5432'
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: ${JWT_EXPIRY}
    command:
    - postgres
    - -c
    - config_file=/etc/postgresql/postgresql.conf
    - -c
    - log_min_messages=fatal
    - -c
    - max_connections=100
    - -c
    - shared_buffers=256MB
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 2g
  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:9999/health
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:?Set
        unique database password}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 256m
  rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - postgrest
      - --ready
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_MAX_ROWS: '1000'
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_JWKS:-${JWT_SECRET}}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command:
    - postgrest
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 256m
  storage:
    image: supabase/storage-api:v1.81.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://storage:5000/status
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 10s
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: 'true'
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: 123charts
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: 123charts
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: 'false'
    volumes:
    - storage:/var/lib/storage
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 512m
  api-gw:
    image: kong/kong:3.9.3
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_started
      storage:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - kong
      - health
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
    - ${API_BIND_IP:?Set loopback or private node address}:${API_PORT:?Set dedicated
      port}:8000
    volumes:
    - ./kong.yml:/home/kong/temp.yml:ro
    - ./upstream/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro
    entrypoint:
    - /bin/sh
    - /home/kong/kong-entrypoint.sh
    environment:
      KONG_DATABASE: 'off'
      KONG_NGINX_WORKER_PROCESSES: '1'
      KONG_MEM_CACHE_SIZE: 32m
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 'off'
      KONG_ROUTER_FLAVOR: expressions
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,post-function
      SUPABASE_ANON_KEY: ${ANON_KEY:?Generate unique JWT}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:?Generate unique JWT}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    pids_limit: 256
    cpus: '0.5'
    mem_limit: 256m
volumes:
  database: {}
  database-config: {}
  storage: {}
